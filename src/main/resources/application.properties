# Twilio Configuration
twilio.account.sid=${TWILIO_ACCOUNT_SID:ACxxxx}
twilio.auth.token=${TWILIO_AUTH_TOKEN:xxxx}
twilio.from.number=${TWILIO_FROM_NUMBER:+1xxxx}

